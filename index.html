<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gantt Chart</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; background: #f8f8f6; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 0.5px solid #ddd; background: #fff; flex-shrink: 0; flex-wrap: wrap; }
  #topbar .title { font-weight: 700; font-size: 14px; color: #1E2761; letter-spacing: -0.3px; }
  #topbar .spacer { flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #666; }
  .legend-dot { width: 12px; height: 7px; border-radius: 2px; }
  .legend-today-line { width: 2px; height: 13px; border-radius: 1px; background: #E24B4A; }
  .legend-golive-line { width: 2px; height: 13px; border-radius: 1px; background: #9B59B6; }
  .divider { width: 1px; height: 20px; background: #e0e0e0; }
  .btn { padding: 5px 12px; border-radius: 6px; border: 0.5px solid #ccc; background: #fff; cursor: pointer; font-size: 12px; color: #333; display: inline-flex; align-items: center; gap: 5px; }
  .btn:hover { background: #f5f5f5; }
  #view-toggle .vt-btn { padding: 4px 10px; border: 0.5px solid #ccc; background: #fff; cursor: pointer; font-size: 12px; color: #555; }
  #view-toggle .vt-btn:first-child { border-radius: 6px 0 0 6px; border-right: none; }
  #view-toggle .vt-btn:last-child { border-radius: 0 6px 6px 0; }
  #view-toggle .vt-btn.active { background: #1E2761; color: #fff; border-color: #1E2761; font-weight: 600; }
  #btn-export { background: #1E2761; color: #fff; border: none; font-weight: 600; }
  #btn-export:hover { background: #16205a; }
  #btn-export:disabled { background: #eee; color: #999; opacity: 0.7; cursor: default; }
  #dropzone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 2px dashed #ccc; margin: 24px; border-radius: 14px; cursor: pointer; background: #fff; transition: all .15s; }
  #dropzone.dragging { border-color: #378ADD; background: #f0f6ff; }
  #dropzone .drop-icon { font-size: 40px; }
  #dropzone .drop-title { font-weight: 700; font-size: 16px; }
  #dropzone .drop-hint { font-size: 12px; color: #888; }
  #dropzone .demo-btn { padding: 7px 18px; border-radius: 7px; border: 0.5px solid #ccc; background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; }
  #error-msg { color: #c33; font-size: 12px; }
  #table-container { flex: 1; overflow: auto; display: none; }
  table { border-collapse: collapse; table-layout: fixed; }
  thead tr { position: sticky; z-index: 10; }
  thead tr.label-row { top: 0; z-index: 12; }
  thead tr.month-row { top: 22px; z-index: 11; }
  thead tr.week-row { top: 44px; z-index: 10; }
  th { padding: 5px 8px; border-bottom: 0.5px solid #ddd; background: #f4f4f2; font-size: 11px; font-weight: 600; color: #555; white-space: nowrap; text-align: center; position: sticky; }
  th.label-th { text-align: left; top: 0; }
  th.month-th { background: #ECEAE3; font-size: 10px; font-weight: 700; color: #444; border-bottom: 0.5px solid #ddd; border-right: 1px solid #ddd; top: 22px; }
  th.col-task { text-align: left; position: sticky; left: 0; z-index: 13; }
  th .ww-label { font-weight: 700; font-size: 11px; }
  th .ww-date { font-size: 9px; color: #999; margin-top: 1px; }
  td { padding: 4px 8px; border-bottom: 0.5px solid #eee; vertical-align: middle; overflow: hidden; }
  td.col-task { position: sticky; left: 0; z-index: 1; }
  .task-link { font-size: 12px; font-weight: 500; color: #185FA5; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-link.epic { font-weight: 700; }
  .task-link.canceled { opacity: 0.45; }
  .task-sub { font-size: 10px; color: #aaa; margin-top: 1px; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  td.gantt-cell { padding: 0; position: relative; }
  .gantt-bar { position: absolute; top: 50%; transform: translateY(-50%); }
  .today-line { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 2px; background: #E24B4A; z-index: 5; pointer-events: none; }
  .today-line-header { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 2px; background: #E24B4A; pointer-events: none; }
  .consolidated-sub { font-size: 10px; color: #888; margin-top: 2px; }
</style>
</head>

<div id="dropzone">

<div id="table-container"><table id="gantt-table"></table></div>

function isoWeek(date) {
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return {ww:Math.ceil(((d-y)/86400000+1)/7),yr:d.getUTCFullYear()};
}
function isoWeekStart(yr,ww) {
  const jan4=new Date(Date.UTC(yr,0,4)),day=jan4.getUTCDay()||7;
  const w1=new Date(jan4); w1.setUTCDate(jan4.getUTCDate()-(day-1));
  const r=new Date(w1); r.setUTCDate(w1.getUTCDate()+(ww-1)*7); return r;
}
function formatWWDate(yr,ww){const d=isoWeekStart(yr,ww);return MONTHS[d.getUTCMonth()]+" "+d.getUTCDate();}
function isoWeeksInYear(y){return isoWeek(new Date(Date.UTC(y,11,28))).ww;}
function parseDate(str){if(!str||!str.trim())return null;const d=new Date(str.trim().replace(/\//g,"-"));return isNaN(d)?null:d;}
function wwKey(yr,ww){return yr*100+ww;}
function wwLabel(ww){return "W"+String(ww).padStart(2,"0");}

function barColor(status,endDate,now){
  const s=(status||"").toLowerCase().trim();
  if(s==="done") return "#BFBFBF";
  if(s==="canceled") return "#D3D1C7";
  if(s==="in progress") return endDate&&endDate<now?"#FFC000":"#92D050";
  // To-Do: overdue if due date has passed
  if(s==="to-do"||s==="to do") return endDate&&endDate<now?"#FFC000":"#00B0F0";
  return "#00B0F0";
}
function badgeInfo(status,endDate,now){
  const s=(status||"").toLowerCase().trim();
  if(s==="done") return {bg:"#E8E8E8",color:"#555",label:"Done"};
  if(s==="canceled") return {bg:"#F1EFE8",color:"#888780",label:"Canceled"};
  if(s==="in progress"&&endDate&&endDate<now) return {bg:"#FFF3CC",color:"#7F6000",label:"Overdue"};
  if(s==="in progress") return {bg:"#EAF5D8",color:"#3B6D11",label:"In progress"};
  if((s==="to-do"||s==="to do")&&endDate&&endDate<now) return {bg:"#FFF3CC",color:"#7F6000",label:"Overdue"};
  return {bg:"#CCF0FC",color:"#006080",label:"To-Do"};
}

function assignLanes(segs){
  const lanes=[];
  segs.forEach(seg=>{
    let placed=false;
    for(let li=0;li<lanes.length;li++){
      if(seg.startKey>lanes[li][lanes[li].length-1].endKey){lanes[li].push(seg);seg._lane=li;placed=true;break;}
    }
    if(!placed){seg._lane=lanes.length;lanes.push([seg]);}
  });
  return Math.max(1,lanes.length);
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const raw=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=[]; let cur="",inQ=false;
    for(const ch of line){if(ch==='"'){inQ=!inQ;continue;}if(ch===','&&!inQ){vals.push(cur);cur="";}else cur+=ch;}
    vals.push(cur);
    const row={}; raw.forEach((h,i)=>row[h]=(vals[i]||"").trim()); return row;
  });
}

function buildWeeks(rows,sc,ec){
  const allKeys=[];
  rows.forEach(r=>{
    const s=parseDate(r[sc]),e=parseDate(r[ec]);
    if(s)allKeys.push(wwKey(isoWeek(s).yr,isoWeek(s).ww));
    if(e)allKeys.push(wwKey(isoWeek(e).yr,isoWeek(e).ww));
  });
  if(!allKeys.length)return[];
  const minKey=Math.min(...allKeys),maxKey=Math.max(...allKeys);
  const weeks=[];let ky=Math.floor(minKey/100),kw=minKey%100;
  while(wwKey(ky,kw)<=maxKey){
    weeks.push({yr:ky,ww:kw,key:wwKey(ky,kw),label:wwLabel(kw),date:formatWWDate(ky,kw)});
    kw++;if(kw>isoWeeksInYear(ky)){ky++;kw=1;}
  }
  return weeks;
}

function buildMonthGroups(weeks){
  const groups=[];
  weeks.forEach(w=>{
    const d=isoWeekStart(w.yr,w.ww);
    const monthKey=d.getUTCFullYear()*100+d.getUTCMonth();
    const label=MONTHS[d.getUTCMonth()]+" '"+String(d.getUTCFullYear()).slice(2);
    const last=groups[groups.length-1];
    if(last&&last.monthKey===monthKey) last.count++;
    else groups.push({monthKey,label,count:1});
  });
  return groups;
}

let appRows=null,appWeeks=[],appCols={},appView="full",appExporting=false;
const now=new Date(); now.setHours(0,0,0,0);
const CELL_W=52,TASK_W=220,ASSIGN_W=110,STATUS_W=90;

function processCSV(text){
  try{
    const parsed=parseCSV(text);
    if(!parsed.length){showError("No rows found.");return;}
    const h=Object.keys(parsed[0]);
    const col=name=>h.find(k=>new RegExp(name,'i').test(k));
    const c={
      key:col("key|ticket")||h[0], sum:col("summary|name|title")||h[1], assign:col("assign"),
      status:col("status"),
      start:col("inferred.start|inferred start")||col("start.date|start date")||col("start"),
      end:col("inferred.due|inferred due")||col("due.date|due date")||col("end|due"),
      type:col("issue.type|type"),
    };
    const wks=buildWeeks(parsed,c.start,c.end);
    if(!wks.length){showError("No valid dates found.");return;}
    showError("");appCols=c;appWeeks=wks;appRows=parsed;renderTable();
  }catch(e){showError("Parse error: "+e.message);}
}
function showError(msg){document.getElementById("error-msg").textContent=msg;}

function buildPhaseRow(){
  if(!appRows||!appCols.start||!appCols.end)return null;
  const allStarts=appRows.map(r=>parseDate(r[appCols.start])).filter(Boolean);
  if(!allStarts.length)return null;
  const projectStart=new Date(Math.min(...allStarts));
  const segs=[];let prevEndKey=wwKey(isoWeek(projectStart).yr,isoWeek(projectStart).ww);
  let prevEndDate=projectStart;
  for(let i=0;i<PHASE_CONFIG.length;i++){
    const ph=PHASE_CONFIG[i];
    const exactMatch=appRows.find(r=>(r[appCols.sum]||"").trim().toUpperCase()===ph.endMatch.toUpperCase());
    const matched=exactMatch||appRows.find(r=>(r[appCols.sum]||"").toUpperCase().includes(ph.endMatch.toUpperCase()));
    const endDate=matched?parseDate(matched[appCols.end]):null;
    const endKey=endDate?wwKey(isoWeek(endDate).yr,isoWeek(endDate).ww):null;
    segs.push({display:ph.label,startKey:prevEndKey,endKey,startDate:prevEndDate,endDate:endDate,color:PHASE_COLORS[i%PHASE_COLORS.length],found:!!endKey});
    if(endDate){prevEndDate=new Date(endDate.getTime()+86400000);}// next day after phase end
    if(endKey)prevEndKey=endKey+1;
  }
  return {label:"Phase",segs,isPhaseRow:true};
}

function buildConsolidatedRows(){
  const phaseRow=buildPhaseRow();
  const configRows=CONSOLIDATED_CONFIG.map(cfg=>{
    const segs=cfg.segments.map(seg=>{
      const candidates=appRows.filter(r=>(r[appCols.sum]||"").toLowerCase().includes(seg.match.toLowerCase()));
      const matched=candidates.sort((a,b)=>(a[appCols.sum]||"").length-(b[appCols.sum]||"").length).pop();
      if(!matched)return null;
      const startDate=parseDate(matched[appCols.start]),endDate=parseDate(matched[appCols.end]);
      const status=matched[appCols.status]||"";
      const startKey=startDate?wwKey(isoWeek(startDate).yr,isoWeek(startDate).ww):null;
      const endKey=endDate?wwKey(isoWeek(endDate).yr,isoWeek(endDate).ww):null;
      const ticket=matched[appCols.key]||"";
      const url=ticket?JIRA+encodeURIComponent(ticket):null;
      return {display:seg.display,startKey,endKey,startDate,endDate,status,color:barColor(status,endDate,now),url};
    }).filter(Boolean);
    return {label:cfg.label,segs};
  });
  return [phaseRow,...configRows].filter(Boolean);
}

function getGoLiveWeekKey(phaseRow){
  if(!phaseRow)return null;
  const tt=phaseRow.segs.find(s=>s.display==="Test & Training");
  return tt?tt.endKey:null;
}

function renderTable(){
  let visibleRows=[];
  if(appView==="full")visibleRows=appRows;
  else if(appView==="epics")visibleRows=appRows.filter(r=>appCols.type&&/epic/i.test(r[appCols.type]||""));

  const consolidatedRows=buildConsolidatedRows();
  const phaseRow=consolidatedRows[0];
  const todayKey=wwKey(isoWeek(now).yr,isoWeek(now).ww);
  const goLiveKey=getGoLiveWeekKey(phaseRow);
  const monthGroups=buildMonthGroups(appWeeks);

  document.getElementById("dropzone").style.display="none";
  document.getElementById("table-container").style.display="block";
  document.getElementById("btn-export").style.display="";

  const hasAssign=appCols.assign&&appView!=="consolidated";
  const colgroup=`<col style="width:${TASK_W}px">${hasAssign?`<col style="width:${ASSIGN_W}px">`:""}<col style="width:${STATUS_W}px">${appWeeks.map(()=>`<col style="width:${CELL_W}px">`).join("")}`;

  const labelRowCells=`<th class="label-th col-task" style="width:${TASK_W}px;min-width:${TASK_W}px;">Task</th>${hasAssign?`<th class="label-th" style="text-align:left;">Assignee</th>`:""}<th class="label-th" style="text-align:left;">Status</th><th colspan="${appWeeks.length}"></th>`;

  const monthRowCells=`<td class="month-th col-task" style="width:${TASK_W}px;min-width:${TASK_W}px;border-bottom:0.5px solid #ddd;"></td>${hasAssign?`<td class="month-th" style="border-bottom:0.5px solid #ddd;"></td>`:""}<td class="month-th" style="border-bottom:0.5px solid #ddd;"></td>${monthGroups.map(g=>`<th class="month-th" colspan="${g.count}">${g.label}</th>`).join("")}`;

  const weekRowCells=`<th class="col-task" style="width:${TASK_W}px;min-width:${TASK_W}px;"></th>${hasAssign?`<th></th>`:""}<th></th>${appWeeks.map(w=>{
    const isToday=w.key===todayKey;
    return `<th style="width:${CELL_W}px;padding:4px 2px;background:${isToday?"#fff5f5":"#f4f4f2"};position:relative;">
      <div class="ww-label" style="color:${isToday?"#A32D2D":"#444"}">${w.label}</div>
      <div class="ww-date" style="color:${isToday?"#c0392b":"#999"}">${w.date}</div>
      ${isToday?'<div class="today-line-header"></div>':""}
    </th>`;
  }).join("")}`;

  const consolidatedHTML=consolidatedRows.map(cr=>{
    const isPhase=!!cr.isPhaseRow;
    const rowBgCell=isPhase?"#1E2761":"#E8EAF6";
    const rowBgGantt=isPhase?"#2A3580":"#EEF0FB";
    const segsWithDates=cr.segs.filter(s=>s.startKey&&s.endKey);
    const numLanes=assignLanes(segsWithDates);
    const LANE_H=28,totalRowPx=numLanes*LANE_H;

    const ganttCells=appWeeks.map(w=>{
      const isToday=w.key===todayKey;
      const isGoLive=goLiveKey&&w.key===goLiveKey;
      const overlapping=segsWithDates.filter(s=>w.key>=s.startKey&&w.key<=s.endKey);
      let html="";
      overlapping.forEach(seg=>{
        const isStart=w.key===seg.startKey,isEnd=w.key===seg.endKey;
        const barH=LANE_H-6,topPx=seg._lane*LANE_H+3;
        html+=`<div onclick="${seg.url?`window.open('${seg.url}','_blank')`:''}" style="position:absolute;top:${topPx}px;height:${barH}px;left:${isStart?4:0}px;right:${isEnd?4:0}px;background:${seg.color};opacity:${seg.found===false?0.3:1};border-radius:${isStart?4:0}px ${isEnd?4:0}px ${isEnd?4:0}px ${isStart?4:0}px;min-width:4px;${seg.url?"cursor:pointer;":""}"></div>`;
        if(isStart){
          const isCanceled=/cancel/i.test(seg.status||"");
          html+=`<div onclick="${seg.url?`window.open('${seg.url}','_blank')`:''}" style="position:absolute;top:${topPx}px;height:${barH}px;left:8px;right:4px;display:flex;align-items:center;font-size:11px;font-weight:700;color:${isPhase?"#fff":"#1a1a1a"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:${isPhase?"0 1px 3px rgba(0,0,0,0.4)":"0 1px 2px rgba(255,255,255,0.4)"};${isCanceled?"text-decoration:line-through;opacity:0.6;":""}z-index:6;pointer-events:${seg.url?"auto":"none"};${seg.url?"cursor:pointer;":""}">${seg.display}</div>`;
        }
      });
      if(isGoLive)html+=`<div style="position:absolute;top:0;bottom:0;right:-1px;width:2px;background:#9B59B6;z-index:6;pointer-events:none;"></div>`;
      if(isToday)html+=`<div class="today-line"></div>`;
      return `<td class="gantt-cell" style="height:${totalRowPx}px;background:${isToday?"rgba(226,75,74,0.08)":rowBgGantt};position:relative;">${html}</td>`;
    }).join("");

    const statuses=cr.segs.map(s=>(s.status||"").toLowerCase().trim());
    const derivedStatus=statuses.every(s=>s==="done")?"Done":statuses.some(s=>s==="in progress")?"In progress":"To-Do";
    const {bg,color:fg}=badgeInfo(derivedStatus,null,now);

    return `<tr>
      <td style="position:sticky;left:0;z-index:1;width:${TASK_W}px;max-width:${TASK_W}px;height:${totalRowPx}px;padding:6px 10px;background:${rowBgCell};border-bottom:${isPhase?"2px solid #4A6FA5":"1.5px solid #9FA8DA"};">
        <div style="font-size:${isPhase?13:12}px;font-weight:700;color:${isPhase?"#fff":"#1E2761"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${isPhase?"":"▶ "}${cr.label}</div>
        ${!isPhase?`<div class="consolidated-sub">${cr.segs.map(s=>s.display).join(" → ")}</div>`:""}
      </td>
      ${hasAssign?`<td style="background:${rowBgCell};height:${totalRowPx}px;border-bottom:${isPhase?"2px solid #4A6FA5":"1.5px solid #9FA8DA"};"></td>`:""}
      <td style="background:${rowBgCell};height:${totalRowPx}px;border-bottom:${isPhase?"2px solid #4A6FA5":"1.5px solid #9FA8DA"};">${isPhase?"":` <span class="badge" style="background:${bg};color:${fg}">${derivedStatus}</span>`}</td>
      ${ganttCells}
    </tr>`;
  }).join("");

  const normalHTML=visibleRows.map((row,i)=>{
    const ticket=row[appCols.key]||"",summary=row[appCols.sum]||ticket;
    const assignee=appCols.assign?(row[appCols.assign]||""):"",status=row[appCols.status]||"";
    const isEpic=appCols.type&&/epic/i.test(row[appCols.type]||""),isCanceled=/cancel/i.test(status);
    const startDate=parseDate(row[appCols.start]),endDate=parseDate(row[appCols.end]);
    const startKey=startDate?wwKey(isoWeek(startDate).yr,isoWeek(startDate).ww):null;
    const endKey=endDate?wwKey(isoWeek(endDate).yr,isoWeek(endDate).ww):null;
    const color=barColor(status,endDate,now),{bg,color:fg,label:lbl}=badgeInfo(status,endDate,now);
    const rowBg=isEpic?"#eeede8":i%2===0?"#fff":"#f9f9f7";
    const shortAssignee=assignee.split(" ").map((p,j)=>j===0?p:p[0]+".").join(" ");
    const ganttCells=appWeeks.map(w=>{
      const inRange=startKey!==null&&endKey!==null&&w.key>=startKey&&w.key<=endKey;
      const isStart=w.key===startKey,isEnd=w.key===endKey,isToday=w.key===todayKey;
      const isGoLive=goLiveKey&&w.key===goLiveKey;
      const barH=isEpic?10:14;
      return `<td class="gantt-cell" style="background:${isToday?"rgba(226,75,74,0.05)":"transparent"};position:relative;">${inRange?`<div class="gantt-bar" style="height:${barH}px;left:${isStart?3:0}px;right:${isEnd?3:0}px;background:${color};opacity:${isCanceled?0.35:1};border-radius:${isStart?3:0}px ${isEnd?3:0}px ${isEnd?3:0}px ${isStart?3:0}px;min-width:3px"></div>`:""}${isToday?'<div class="today-line"></div>':""}${isGoLive?`<div style="position:absolute;top:0;bottom:0;right:-1px;width:2px;background:#9B59B6;z-index:5;pointer-events:none;"></div>`:""}</td>`;
    }).join("");
    return `<tr style="background:${rowBg}">
      <td class="col-task" style="background:${rowBg};width:${TASK_W}px;max-width:${TASK_W}px"><a href="${JIRA}${encodeURIComponent(ticket)}" target="_blank" rel="noreferrer" class="task-link${isEpic?" epic":""}${isCanceled?" canceled":""}" title="${summary.replace(/"/g,"&quot;")}">↗ ${summary}</a><div class="task-sub">${ticket}${isEpic?" · Epic":""}</div></td>
      ${hasAssign?`<td style="font-size:11px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${assignee}">${shortAssignee}</td>`:""}
      <td><span class="badge" style="background:${bg};color:${fg}">${lbl}</span></td>
      ${ganttCells}
    </tr>`;
  }).join("");

  const tbodyContent=appView==="consolidated"
    ?consolidatedHTML
    :consolidatedHTML+(visibleRows.length?`<tr><td colspan="999" style="padding:4px 10px;font-size:10px;color:#aaa;background:#f8f8f6;border-bottom:1px solid #e0e0e0;letter-spacing:0.5px">ALL TASKS</td></tr>`:"")+normalHTML;

  document.getElementById("gantt-table").innerHTML=`<colgroup>${colgroup}</colgroup><thead><tr class="label-row">${labelRowCells}</tr><tr class="month-row">${monthRowCells}</tr><tr class="week-row">${weekRowCells}</tr></thead><tbody>${tbodyContent}</tbody>`;
}

async function loadPptxGen(){
  if(window.PptxGenJS)return;
  await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";
    s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
  });
}

function dayFrac(date, weeks) {
  // Returns {weekIdx, frac} where frac is 0..1 position within that week's column
  if(!date) return null;
  const key = wwKey(isoWeek(date).yr, isoWeek(date).ww);
  const wi = weeks.findIndex(w => w.key === key);
  if(wi < 0) return null;
  const weekStart = isoWeekStart(weeks[wi].yr, weeks[wi].ww);
  const dayOffset = Math.round((date - weekStart) / 86400000); // 0=Mon .. 6=Sun
  const frac = Math.min(Math.max(dayOffset / 7, 0), 1);
  return {wi, frac};
}

async function exportConsolidatedPptx(consolidatedRows,weeks,now){
  await loadPptxGen();
  const pres=new window.PptxGenJS();
  pres.layout="LAYOUT_WIDE";pres.title="Master Schedule";
  const SW=13.3,ML=0.25,MT=0.25,TITLE_H=0.5,MONTH_H=0.22,HDR_H=0.45,ROW_H=0.28;
  const TASK_COL_W=1.8,CHART_X=ML+TASK_COL_W,CHART_W=SW-CHART_X-0.1,COL_W=CHART_W/weeks.length;
  const todayKey=wwKey(isoWeek(now).yr,isoWeek(now).ww),todayIdx=weeks.findIndex(w=>w.key===todayKey);
  const pRow=consolidatedRows.find(cr=>cr.isPhaseRow);
  const goLiveKey=pRow?getGoLiveWeekKey(pRow):null;
  const goLiveIdx=goLiveKey?weeks.findIndex(w=>w.key===goLiveKey):-1;
  const goLiveX=goLiveIdx>=0?CHART_X+goLiveIdx*COL_W+COL_W:null;
  const monthGroups=buildMonthGroups(weeks);

  const slide=pres.addSlide();slide.background={color:"FFFFFF"};
  slide.addText("Master Schedule",{x:ML,y:0,w:6,h:TITLE_H,fontSize:15,bold:true,color:"002060",valign:"middle",margin:0});

  const legendItems=[
    {label:"To-Do",color:"00B0F0"},{label:"In progress",color:"92D050"},
    {label:"Overdue",color:"FFC000"},{label:"Done",color:"BFBFBF"},
    {label:"Canceled",color:"D3D1C7"},{label:"Today",color:"E24B4A",line:true},
    {label:"Go-Live",color:"9B59B6",line:true},
  ];
  let lx=SW-0.1;
  legendItems.slice().reverse().forEach(({label,color,line})=>{
    const textW=label.length*0.075+0.05;lx-=textW;
    slide.addText(label,{x:lx,y:0,w:textW,h:TITLE_H,fontSize:7.5,color:"002060",valign:"middle",margin:0});
    lx-=0.18;
    if(line)slide.addShape(pres.shapes.LINE,{x:lx+0.06,y:TITLE_H/2-0.08,w:0,h:0.16,line:{color,width:2}});
    else slide.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:lx,y:TITLE_H/2-0.06,w:0.15,h:0.1,fill:{color},line:{color,width:0},rectRadius:0.02});
    lx-=0.08;
  });

  const rowMeta=consolidatedRows.map(cr=>{
    const segsWithDates=cr.segs.filter(s=>s.startKey&&s.endKey);
    const lanes=[];
    segsWithDates.forEach(seg=>{
      let placed=false;
      for(let li=0;li<lanes.length;li++){
        if(seg.startKey>lanes[li][lanes[li].length-1].endKey){lanes[li].push(seg);seg._lane=li;placed=true;break;}
      }
      if(!placed){seg._lane=lanes.length;lanes.push([seg]);}
    });
    return{segsWithDates,numLanes:Math.max(1,lanes.length),rowH:Math.max(1,lanes.length)*ROW_H};
  });

  const colW=[TASK_COL_W,...weeks.map(()=>COL_W)];

  const monthRow=[{text:"",options:{fill:{color:"ECEAE3"}}}];
  monthGroups.forEach(g=>{
    monthRow.push({text:g.label,options:{colspan:g.count,fill:{color:"ECEAE3"},fontSize:7,bold:true,color:"444444",align:"center",valign:"middle"}});
  });

  const weekRow=[{text:"Track",options:{fill:{color:"EEEDE8"},fontSize:8,bold:true,color:"444444",valign:"middle",align:"left"}}];
  weeks.forEach(w=>{
    const isToday=w.key===todayKey;
    weekRow.push({
      text:[
        {text:w.label+"\n",options:{fontSize:7,bold:true,color:isToday?"A32D2D":"333333",breakLine:true}},
        {text:w.date,options:{fontSize:5,color:isToday?"C0392B":"999999"}},
      ],
      options:{fill:{color:isToday?"FFF0F0":"F4F4F2"},align:"center",valign:"middle"},
    });
  });

  const bodyRows=consolidatedRows.map((cr,ri)=>{
    const isPhase=!!cr.isPhaseRow;
    const trackFill=isPhase?"1E2761":"E8EAF6";
    const ganttFill=isPhase?"2A3580":"EEF0FB";
    const row=[{text:cr.label,options:{fill:{color:trackFill},fontSize:8,bold:true,color:isPhase?"FFFFFF":"1E2761",valign:"middle",align:"left"}}];
    weeks.forEach((w,wi)=>{
      const isMonthEnd=monthGroups.length&&(()=>{
        let acc=0;
        for(const g of monthGroups){acc+=g.count; if(wi===acc-1) return true; if(wi<acc) return false;}
        return false;
      })();
      row.push({text:"",options:{fill:{color:ganttFill},border:isMonthEnd?[{type:"none"},{type:"solid",color:"BFBFBF",pt:1},{type:"none"},{type:"none"}]:[{type:"none"},{type:"none"},{type:"none"},{type:"none"}]}});
    });
    return row;
  });

  const tableRows=[monthRow,weekRow,...bodyRows];
  const totalBodyH=rowMeta.reduce((a,m)=>a+m.rowH,0);
  const tableY=MT+TITLE_H;

  slide.addTable(tableRows,{
    x:ML,y:tableY,w:SW-ML-0.1,
    colW,
    rowH:[MONTH_H,HDR_H,...rowMeta.map(m=>m.rowH)],
    border:{type:"solid",color:"DDDDDD",pt:0.5},
    margin:0,
    autoPage:false,
  });

  const hdrY=tableY+MONTH_H+HDR_H;

  // Day-precise today line
  const todayFrac=dayFrac(now,weeks);
  if(todayFrac){const tx=CHART_X+todayFrac.wi*COL_W+todayFrac.frac*COL_W;slide.addShape(pres.shapes.LINE,{x:tx,y:tableY,w:0,h:MONTH_H+HDR_H+totalBodyH,line:{color:"E24B4A",width:1.5}});}

  // Day-precise go-live line
  if(pRow){
    const glSeg=pRow.segs.find(s=>s.display==="Test & Training");
    if(glSeg&&glSeg.endKey){
      const glRow=consolidatedRows.find(cr=>cr.isPhaseRow);
      // find the actual go-live epic end date
      const glEpic=appRows&&appCols?appRows.find(r=>(r[appCols.sum]||"").trim().toUpperCase()==="GO-LIVE"):null;
      const glDate=glEpic?parseDate(glEpic[appCols.end]):null;
      const glFrac=glDate?dayFrac(glDate,weeks):null;
      if(glFrac){const gx=CHART_X+glFrac.wi*COL_W+glFrac.frac*COL_W;slide.addShape(pres.shapes.LINE,{x:gx,y:tableY,w:0,h:MONTH_H+HDR_H+totalBodyH,line:{color:"9B59B6",width:1.5}});}
      else if(goLiveX){slide.addShape(pres.shapes.LINE,{x:goLiveX,y:tableY,w:0,h:MONTH_H+HDR_H+totalBodyH,line:{color:"9B59B6",width:1.5}});}
    }
  } else if(goLiveX){slide.addShape(pres.shapes.LINE,{x:goLiveX,y:tableY,w:0,h:MONTH_H+HDR_H+totalBodyH,line:{color:"9B59B6",width:1.5}});}

  let curY=hdrY;
  consolidatedRows.forEach((cr,ri)=>{
    const isPhase=!!cr.isPhaseRow;
    const{segsWithDates,rowH}=rowMeta[ri];
    const rowY=curY;curY+=rowH;

    segsWithDates.forEach(seg=>{
      // Use day-level precision when dates available, else fall back to week index
      const sf=seg.startDate?dayFrac(seg.startDate,weeks):null;
      const ef=seg.endDate?dayFrac(seg.endDate,weeks):null;
      const sIdx=weeks.findIndex(w=>w.key===seg.startKey);
      const eIdx=weeks.findIndex(w=>w.key===seg.endKey);
      if(!sf&&sIdx<0)return;
      if(!ef&&eIdx<0)return;
      const PAD=0.02;
      const bX=sf?CHART_X+sf.wi*COL_W+sf.frac*COL_W+PAD:CHART_X+sIdx*COL_W+PAD;
      const bXend=ef?CHART_X+ef.wi*COL_W+(ef.frac+1/7)*COL_W-PAD:CHART_X+(eIdx+1)*COL_W-PAD;
      const bW=Math.max(bXend-bX, COL_W*0.2);
      const laneH=ROW_H,barH=laneH*0.6,laneY=rowY+seg._lane*laneH,barY=laneY+(laneH-barH)/2;
      const hex=seg.color.replace("#","");
      const isCanceled=/cancel/i.test(seg.status||"");
      const cmToPt=cm=>(cm/2.54)*72;
      slide.addText(seg.display,{
        shape:pres.shapes.ROUNDED_RECTANGLE,
        x:bX,y:barY,w:bW,h:barH,
        rectRadius:0.03,
        fill:{color:hex,transparency:isCanceled?50:seg.found===false?60:0},
        line:{type:"none"},
        fontSize:10,bold:true,
        color:isPhase?"FFFFFF":"1a1a1a",
        valign:"middle",align:"left",
        margin:[cmToPt(0.10),0,0,0],
        wrap:false,strike:isCanceled,
        hyperlink:seg.url?{url:seg.url}:undefined,
      });
    });
  });

  await pres.writeFile({fileName:"progress-overview.pptx"});
}

async function exportToPptx(visibleRows,weeks,cols,now){
  await loadPptxGen();
  const pres=new window.PptxGenJS();
  pres.layout="LAYOUT_WIDE";pres.title="Gantt Chart";
  const SW=13.3,SH=7.5,ML=0.25,MT=0.25,TITLE_H=0.5,MONTH_H=0.22,HDR_H=0.45,ROW_H=0.26,TASK_COL_W=2.6,STATUS_COL_W=0.9;
  const AVAIL_H=SH-MT-TITLE_H-MONTH_H-HDR_H-0.2,ROWS_PER_SLIDE=Math.floor(AVAIL_H/ROW_H);
  const CHART_X=ML+TASK_COL_W+STATUS_COL_W,CHART_W=SW-CHART_X-0.1,COL_W=CHART_W/weeks.length;
  const todayKey=wwKey(isoWeek(now).yr,isoWeek(now).ww),todayIdx=weeks.findIndex(w=>w.key===todayKey);
  const monthGroups=buildMonthGroups(weeks);
  const chunks=[];
  for(let i=0;i<visibleRows.length;i+=ROWS_PER_SLIDE)chunks.push(visibleRows.slice(i,i+ROWS_PER_SLIDE));
  if(!chunks.length)chunks.push([]);
  chunks.forEach((chunk,pageIdx)=>{
    const slide=pres.addSlide();slide.background={color:"FFFFFF"};
    slide.addShape(pres.shapes.RECTANGLE,{x:0,y:0,w:SW,h:TITLE_H,fill:{color:"1E2761"},line:{color:"1E2761",width:0}});
    slide.addText(`Gantt Chart${chunks.length>1?`   (${pageIdx+1} / ${chunks.length})`:""}`,{x:ML,y:0,w:7,h:TITLE_H,fontSize:15,bold:true,color:"FFFFFF",valign:"middle",margin:0});
    const legendItems=[{label:"To-Do",color:"00B0F0"},{label:"In progress",color:"92D050"},{label:"Overdue",color:"FFC000"},{label:"Done",color:"BFBFBF"},{label:"Canceled",color:"D3D1C7"},{label:"Today",color:"E24B4A",line:true}];
    let lx=SW-0.1;
    legendItems.slice().reverse().forEach(({label,color,line})=>{
      const textW=label.length*0.075+0.05;lx-=textW;
      slide.addText(label,{x:lx,y:0,w:textW,h:TITLE_H,fontSize:7.5,color:"CADCFC",valign:"middle",margin:0});
      lx-=0.18;
      if(line)slide.addShape(pres.shapes.LINE,{x:lx+0.06,y:TITLE_H/2-0.08,w:0,h:0.16,line:{color,width:2}});
      else slide.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:lx,y:TITLE_H/2-0.06,w:0.15,h:0.1,fill:{color},line:{color,width:0},rectRadius:0.02});
      lx-=0.08;
    });
    const monthY=MT+TITLE_H;
    slide.addShape(pres.shapes.RECTANGLE,{x:ML,y:monthY,w:TASK_COL_W+STATUS_COL_W,h:MONTH_H,fill:{color:"ECEAE3"},line:{color:"DDDDDD",width:0.5}});
    let mx=CHART_X;
    monthGroups.forEach(g=>{
      const gw=g.count*COL_W;
      slide.addShape(pres.shapes.RECTANGLE,{x:mx,y:monthY,w:gw,h:MONTH_H,fill:{color:"ECEAE3"},line:{color:"DDDDDD",width:0.5}});
      slide.addText(g.label,{x:mx,y:monthY,w:gw,h:MONTH_H,fontSize:7,bold:true,color:"444444",align:"center",valign:"middle",margin:0});
      mx+=gw;
    });
    const hdrY=monthY+MONTH_H;
    slide.addShape(pres.shapes.RECTANGLE,{x:ML,y:hdrY,w:TASK_COL_W+STATUS_COL_W,h:HDR_H,fill:{color:"EEEDE8"},line:{color:"DDDDDD",width:0.5}});
    slide.addText("Task",{x:ML+0.06,y:hdrY,w:TASK_COL_W-0.06,h:HDR_H,fontSize:8,bold:true,color:"444444",valign:"middle",margin:0});
    slide.addText("Status",{x:ML+TASK_COL_W+0.04,y:hdrY,w:STATUS_COL_W,h:HDR_H,fontSize:8,bold:true,color:"444444",valign:"middle",margin:0});
    weeks.forEach((w,wi)=>{
      const x=CHART_X+wi*COL_W,isToday=w.key===todayKey;
      slide.addShape(pres.shapes.RECTANGLE,{x,y:hdrY,w:COL_W,h:HDR_H,fill:{color:isToday?"FFF0F0":"F4F4F2"},line:{color:"DDDDDD",width:0.5}});
      slide.addText(w.label,{x:x+0.01,y:hdrY+0.01,w:COL_W-0.02,h:HDR_H*0.55,fontSize:Math.max(5,Math.min(7.5,COL_W*36)),bold:true,color:isToday?"A32D2D":"333333",align:"center",valign:"bottom",margin:0});
      slide.addText(w.date,{x:x+0.01,y:hdrY+HDR_H*0.55,w:COL_W-0.02,h:HDR_H*0.45,fontSize:Math.max(4,Math.min(6,COL_W*28)),color:isToday?"C0392B":"999999",align:"center",valign:"top",margin:0});
    });
    if(todayIdx>=0){const tx=CHART_X+todayIdx*COL_W+COL_W/2;slide.addShape(pres.shapes.LINE,{x:tx,y:monthY,w:0,h:MONTH_H+HDR_H,line:{color:"E24B4A",width:1.5}});}
    chunk.forEach((row,ri)=>{
      const rowY=hdrY+HDR_H+ri*ROW_H,ticket=row[cols.key]||"",summary=row[cols.sum]||ticket,status=row[cols.status]||"";
      const isEpic=cols.type&&/epic/i.test(row[cols.type]||""),isCanceled=/cancel/i.test(status);
      const startDate=parseDate(row[cols.start]),endDate=parseDate(row[cols.end]);
      const startKey=startDate?wwKey(isoWeek(startDate).yr,isoWeek(startDate).ww):null;
      const endKey=endDate?wwKey(isoWeek(endDate).yr,isoWeek(endDate).ww):null;
      const hexColor=barColor(status,endDate,now).replace("#",""),{label:statusLabel}=badgeInfo(status,endDate,now);
      const rowBg=isEpic?"EEEDE8":ri%2===0?"FFFFFF":"F9F9F7";
      slide.addShape(pres.shapes.RECTANGLE,{x:ML,y:rowY,w:TASK_COL_W+STATUS_COL_W,h:ROW_H,fill:{color:rowBg},line:{color:"EEEEEE",width:0.3}});
      slide.addText(summary,{x:ML+(isEpic?0.04:0.12),y:rowY,w:TASK_COL_W-0.14,h:ROW_H,fontSize:isEpic?7.5:7,bold:isEpic,color:isCanceled?"AAAAAA":"185FA5",valign:"middle",margin:0,hyperlink:{url:JIRA+encodeURIComponent(ticket)}});
      const badgeColors={"Done":{bg:"E8E8E8",fg:"555555"},"Overdue":{bg:"FFF3CC",fg:"7F6000"},"In progress":{bg:"EAF5D8",fg:"3B6D11"},"Canceled":{bg:"F1EFE8",fg:"888780"},"To-Do":{bg:"CCF0FC",fg:"006080"}};
      const bc=badgeColors[statusLabel]||badgeColors["To-Do"];
      const bW=0.75,bH=ROW_H*0.62,bX=ML+TASK_COL_W+(STATUS_COL_W-bW)/2,bY=rowY+(ROW_H-bH)/2;
      slide.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:bX,y:bY,w:bW,h:bH,fill:{color:bc.bg},line:{color:bc.bg,width:0},rectRadius:0.05});
      slide.addText(statusLabel,{x:bX,y:bY,w:bW,h:bH,fontSize:6,bold:true,color:bc.fg,align:"center",valign:"middle",margin:0});
      slide.addShape(pres.shapes.RECTANGLE,{x:CHART_X,y:rowY,w:CHART_W,h:ROW_H,fill:{color:rowBg},line:{color:"EEEEEE",width:0.3}});
      if(todayIdx>=0)slide.addShape(pres.shapes.RECTANGLE,{x:CHART_X+todayIdx*COL_W,y:rowY,w:COL_W,h:ROW_H,fill:{color:"FFF0F0",transparency:40},line:{color:"EEEEEE",width:0.3}});
      if(startKey!==null&&endKey!==null){
        const si=weeks.findIndex(w=>w.key===startKey),ei=weeks.findIndex(w=>w.key===endKey);
        if(si>=0&&ei>=0){
          const PAD=0.03,barX=CHART_X+si*COL_W+PAD,barW=(ei-si+1)*COL_W-PAD*2;
          const barH=isEpic?ROW_H*0.45:ROW_H*0.55,barY=rowY+(ROW_H-barH)/2;
          slide.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:barX,y:barY,w:Math.max(barW,COL_W*0.5),h:barH,fill:{color:hexColor,transparency:isCanceled?50:0},line:{color:hexColor,width:0},rectRadius:0.04});
        }
      }
      if(todayIdx>=0){const tx=CHART_X+todayIdx*COL_W+COL_W/2;slide.addShape(pres.shapes.LINE,{x:tx,y:rowY,w:0,h:ROW_H,line:{color:"E24B4A",width:1.5}});}
    });
    const bottomY=hdrY+HDR_H+chunk.length*ROW_H;
    slide.addShape(pres.shapes.LINE,{x:ML,y:bottomY,w:SW-ML-0.1,h:0,line:{color:"CCCCCC",width:0.5}});
  });
  await pres.writeFile({fileName:"gantt-chart.pptx"});
}
</script>
